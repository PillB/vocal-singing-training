name: BreathFlow teaching acceptance
on:
  pull_request:
    paths:
      - 'breathflow.html'
      - 'js/breathflow*.js'
      - 'css/breathflow*.css'
      - 'tests/breathflow.spec.js'
      - 'tests/admin.spec.js'
      - 'qa/asset-manifest.json'
      - '.github/workflows/breathflow-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: breathflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  teaching-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Teaching, body checkpoints, saving, denied/late mic, mobile
        run: npx playwright test tests/breathflow.spec.js --project=chromium --workers=2 --reporter=line
        env:
          CI: '1'
      - name: Preserve failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: breathflow-focused-failures
          path: test-results/
          if-no-files-found: ignore
