name: Quality and production regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:core

  browser-contracts:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      MIC_HELP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Chromium production regression contracts (headed-safe)
        run: xvfb-run -a npx playwright test tests/production-contracts.spec.js --project=chromium --workers=2 --global-timeout=900000
      - name: Preserve production-contract failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-contract-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  safari-audio:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      MIC_HELP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps webkit
      - name: WebKit desktop and iPhone Safari audio recovery contracts
        run: xvfb-run -a npx playwright test tests/cross-browser-audio.spec.js tests/safari-mobile-recovery.spec.js tests/exercise-start-visibility.spec.js --project=webkit --project=mobile-safari --workers=2 --global-timeout=1200000
      - name: Preserve WebKit interruption and permission diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safari-audio-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  browser:
    needs: browser-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: '1'
      MIC_HELP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Chromium full journey suite (shard ${{ matrix.shard }} of 4)
        run: xvfb-run -a npx playwright test --project=chromium --workers=2 --shard=${{ matrix.shard }}/4 --global-timeout=3000000 --max-failures=25
      - name: Preserve browser failures for forensic review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
