name: Quality and production regressions

# PR gate: lint + catalog + Node/Worker + mutation check, the browser mutation sets
# (one job each), then the headless Chromium suite in 4 balanced shards (one generated
# test per exercise).
# Nightly / manual: the headed "watch" sweeps (Playwright project `sweep`)
# and the live GitHub Pages check. Those take ~40 min, write screenshots and
# reports, and were never meant to gate a pull request.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      sweeps:
        description: "Also run the headed sweeps and live Pages check"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run affected integration flows before the longer core/mutation dependency.
  integration-focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser-language.spec.js tests/home-design.spec.js tests/session-sets.spec.js tests/song-library.spec.js tests/sweep-reachability.spec.js --project=chromium --workers=2 --reporter=line
      - run: npx playwright test tests/redteam-exercise-language.spec.js --project=chromium --workers=2 --reporter=line -g 'stage refit respects|open panels and the scroll position'
      - name: Preserve focused browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-focus-failures
          path: test-results/

  safari-layout:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CI: '1'
      MIC_HELP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install webkit
      - name: macOS WebKit design selection and device layouts
        run: npx playwright test --project=webkit-layout --workers=2 --reporter=line --global-timeout=600000
      - name: Native select regression must be detected on macOS
        env:
          # Isolate this nested runner from the preceding suite's server.
          VT_TEST_PORT: '8766'
          DEBUG: 'pw:webserver'
        run: bash qa/check-safari-selector.sh
      - name: Preserve macOS WebKit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safari-layout-failures
          path: test-results/
          if-no-files-found: ignore

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:core
      - name: chore(lint) the complexity baseline may only shrink against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node qa/lint-complexity.mjs --baseline-ref "origin/$BASE_REF"
      - name: Mutation check (every planted audio and lint defect must turn a test red)
        run: node qa/mutate.mjs

  browser-contracts:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: '1'
      MIC_HELP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Chromium production regression contracts (headed-safe)
        run: xvfb-run -a npx playwright test tests/production-contracts.spec.js --project=chromium --workers=2 --global-timeout=900000
      - name: Preserve production-contract failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-contract-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  # The browser mutation sets, one job each. They ran as one step of browser-contracts and, once a11y grew
  # to 26 mutants, outlived that job's 30 minute limit (cancelled, not red: QA-45). Each mutant is judged by
  # the spec written to catch it; the nightly job below runs the a11y group wide as well. The first paint's
  # mutants (boot) left regress for the same reason: with them it took 28.3 of its 30 minutes (PR #42).
  mutation:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        set: [stage, a11y, flows, regress, boot, billing, scoring, controls, audit, toast, designs, splits, syncing, inject, learner, authwall, promises, promises-time-2, promises-time-3, promises-voice, promises-account-ads, lang, pathui, curriculumui]
    env:
      CI: '1'
      MIC_HELP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: "Mutation check (${{ matrix.set }}): every planted defect must turn its test red"
        run: node qa/mutate.mjs ${{ matrix.set }}
      # A red set is read from its traces, not only re-run: under CI Playwright keeps one per failing test, and
      # qa/mutate.mjs stops a set at its first red command, so test-results/ still holds that run. Without this the
      # boot set's red baseline on PR #46 (one frame of 500, not seen in 110 runs elsewhere) left nothing to read.
      # One name per set: two jobs that upload under one name, the second is refused.
      - name: Preserve a red set's traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-failures-${{ matrix.set }}
          path: test-results/
          if-no-files-found: ignore

  safari-audio:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      MIC_HELP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps webkit
      - name: WebKit desktop and iPhone Safari audio recovery contracts
        run: xvfb-run -a npx playwright test tests/cross-browser-audio.spec.js tests/safari-mobile-recovery.spec.js tests/exercise-start-visibility.spec.js tests/piano-dropped-call.spec.js --project=webkit --project=mobile-safari --workers=2 --global-timeout=1200000
      - name: Preserve WebKit interruption and permission diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safari-audio-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  browser:
    needs: browser-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: '1'
      MIC_HELP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Chromium PR gate (shard ${{ matrix.shard }} of 4)
        run: xvfb-run -a npx playwright test --project=chromium --workers=2 --shard=${{ matrix.shard }}/4 --global-timeout=2100000
      - name: Preserve browser failures for forensic review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  # Nightly: the a11y mutants against all six browser specs at once (MUTATE_WIDE). The PR job judges each by its
  # own spec; this catches a mutant that one spec stopped killing while another still does.
  mutation-wide:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      MIC_HELP: '0'
      MUTATE_WIDE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Mutation check, a11y group against every browser spec
        run: node qa/mutate.mjs a11y

  # Nightly sweeps are deliberately partitioned: the old serial job exhausted
  # 110 minutes and silently left three forensic specs unexecuted.
  sweeps:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sweeps)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: geometry
            specs: "tests/exercise-ui-forensics.spec.js"
          # The two used to share a job: 22 min of live forensics and about 87 of the six-format mouse sweep
          # ran into the 80 min suite timeout every night from Nov 9, on its fifth format. The mouse sweep
          # now runs in two jobs of three formats each (tests/node/nightly-sweep-contract.test.mjs checks
          # that the halves cover every format of the spec once, and that the spec runs the ones it is given).
          - group: voice-and-live
            specs: "tests/exercise-live-forensics.spec.js"
          - group: formats-1-of-2
            specs: "tests/headed-exercise-forensics.spec.js"
            formats: "desktop,mobile,mobile-land"
          - group: formats-2-of-2
            specs: "tests/headed-exercise-forensics.spec.js"
            formats: "tablet,short,fullscreen"
          - group: click
            specs: "tests/click-ui-formats.spec.js tests/click-ui-live-log.spec.js tests/headed-formats-clicks.spec.js"
          - group: fullscreen
            specs: "tests/fullscreen-all-clicks.spec.js tests/live-mouse-demo.spec.js"
    env:
      CI: '1'
      MIC_HELP: '0'
      SLOWMO: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Headed watch sweeps (${{ matrix.group }})
        if: matrix.group != 'fullscreen'
        env:
          FORENSICS_FORMATS: ${{ matrix.formats }}
        run: xvfb-run -a npx playwright test ${{ matrix.specs }} --project=sweep --workers=1 --global-timeout=4800000
      - name: Fullscreen mouse controls isolated per exercise
        if: matrix.group == 'fullscreen'
        # The step shell is bash -e: without "|| rc=1" the first red exercise ended the step, and the
        # exercises after it and the live mouse demo never ran. Each runs; the step is red if any was.
        run: |
          rc=0
          for id in v1-diction s15-sh-air-ladder s9-pitch-match s2-solfege-chords; do
            FULLSCREEN_IDS="$id" xvfb-run -a npx playwright test tests/fullscreen-all-clicks.spec.js --project=sweep --workers=1 --global-timeout=450000 --output="test-results/fullscreen-$id" || rc=1
          done
          xvfb-run -a npx playwright test tests/live-mouse-demo.spec.js --project=sweep --workers=1 --global-timeout=1200000 --output="test-results/live-mouse" || rc=1
          exit $rc
      - name: Live GitHub Pages smoke
        if: always() && matrix.group == 'fullscreen'
        # Its own --output: Playwright empties the output folder it starts with, and this step runs after a
        # red fullscreen step too, so the default test-results/ took that step's traces with it every night
        # ("No files were found" at the upload below).
        run: LIVE_PAGES=1 xvfb-run -a npx playwright test tests/live-pages.spec.js --project=chromium --workers=1 --output="test-results/live-pages"
      - name: Preserve sweep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-reports-${{ matrix.group }}
          path: |
            test-results/
            qa/geometry/
            qa/screenshots/
          if-no-files-found: ignore

  # Exercise the nightly-only report path and fullscreen controls on PRs,
  # rather than letting another two scheduled runs fail before investigation.
  sweep-smoke:
    if: github.event_name == 'pull_request'
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: '1'
      MIC_HELP: '0'
      SLOWMO: '5'
      CLICK_UI_IDS: 'v1-diction'
      FULLSCREEN_IDS: 'v1-diction'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Six-format real-mouse report smoke
        run: xvfb-run -a npx playwright test tests/click-ui-formats.spec.js --project=sweep --workers=1 --global-timeout=600000
      - name: Fullscreen mouse and control smoke
        run: xvfb-run -a npx playwright test tests/fullscreen-all-clicks.spec.js --project=sweep --workers=1 --global-timeout=600000
      - name: Preserve headed smoke failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-smoke-failures
          path: |
            test-results/
            qa/geometry/
            qa/screenshots/
          if-no-files-found: ignore
