name = "vocal-studio-entitlements"
main = "src/index.js"
compatibility_date = "2025-09-01"

# --- KV -----------------------------------------------------------------
# Create the namespaces first, then paste the ids printed by:
#   wrangler kv namespace create ENTITLEMENTS
#   wrangler kv namespace create ENTITLEMENTS --preview
[[kv_namespaces]]
binding = "ENTITLEMENTS"
id = "TODO_REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "TODO_REPLACE_WITH_KV_PREVIEW_NAMESPACE_ID"

# --- D1 (accounts, grants, saved progress) ------------------------------
# Optional. Without this binding the worker still serves the anonymous
# pay -> claim -> license flow exactly as before; every /v1/auth, /v1/me and
# /v1/admin route answers 503 accounts_not_configured instead.
# Create it first, then paste the id printed by:
#   wrangler d1 create vocal-studio-accounts
[[d1_databases]]
binding = "DB"
database_name = "vocal-studio-accounts"
database_id = "TODO_REPLACE_WITH_D1_DATABASE_ID"

# --- Public configuration (safe to commit) ------------------------------
[vars]
# Exact origin of the site, used as the token audience and as the only
# allowed CORS origin. No trailing slash.
SITE_ORIGIN = "https://pillb.github.io"
# Key id advertised in the token header and in /v1/jwks. Bump on rotation.
LICENSE_KEY_ID = "k1"
# Token lifetime in seconds (72h). Clamped to 60..2592000 by the worker.
LICENSE_TTL_SECONDS = "259200"
# Optional: map provider price/plan ids onto our plan ids. Leave empty to fall
# back to checkout metadata, then to the subscription interval.
STRIPE_PRICE_PRO_MONTHLY = ""
STRIPE_PRICE_PRO_YEARLY = ""
MP_PLAN_PRO_MONTHLY = ""
MP_PLAN_PRO_YEARLY = ""
# Length of the free trial, in days. One per account, ever.
TRIAL_DAYS = "30"
# Comma-separated emails allowed to gift and revoke months. Read on every
# request, so removing an address here takes effect on the next deploy.
ADMIN_EMAILS = ""
# Google Sign-In client id (public by design). Empty disables Google sign-in.
GOOGLE_CLIENT_ID = ""
# Transactional email for the one-time sign-in codes: resend | brevo | mailersend.
# Empty disables email sign-in rather than silently dropping codes.
EMAIL_PROVIDER = ""
EMAIL_FROM = ""
EMAIL_FROM_NAME = "Vocal Studio"
# Anonymous usage events for A/B tests (POST /v1/events, stored in D1). Set to
# "false" to stop recording at once; the site keeps working either way.
EVENTS_ENABLED = "true"

# --- Secrets (NEVER put values in this file) ----------------------------
# Set each one with `wrangler secret put <NAME>`:
#   STRIPE_WEBHOOK_SECRET          whsec_... for THIS endpoint (test and live differ)
#   MP_WEBHOOK_SECRET              Mercado Pago webhook signing secret
#   MP_ACCESS_TOKEN                Mercado Pago access token (server-side API reads)
#   LICENSE_PRIVATE_KEY_PKCS8_B64  base64 PKCS#8 P-256 private key
#                                  (scripts/generate-keys.mjs prints it)
# Accounts only, and only for the provider named in EMAIL_PROVIDER:
#   RESEND_API_KEY                 re_...
#   BREVO_API_KEY                  xkeysib-...
#   MAILERSEND_API_KEY             mlsn....
# Optional, for the event route's per-address rate-limit buckets (an HMAC
# under this key; without it one derived from the license key is used):
#   EVENTS_IP_KEY                  any long random string

# Daily housekeeping at 09:17 UTC (04:17 in Lima): deletes expired sign-in
# codes and sessions, stale rate-limit rows, and usage events, A/B exposures
# and ingest counters older than 180 days. The privacy page promises that
# deletion, so keep this trigger.
[triggers]
crons = ["17 9 * * *"]

[observability]
enabled = true
